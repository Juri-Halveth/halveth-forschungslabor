[package]
name = "lucinet-core"
description = "I/O-free canonical semantics for the LUCINET P0 core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
