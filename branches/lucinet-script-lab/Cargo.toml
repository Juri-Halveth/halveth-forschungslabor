[package]
name = "lucinet-script-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Source-bound Unicode identity and display-layer analysis"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
unicode-bidi = "=0.3.18"
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.3"

[[bin]]
name = "lucinet-script-lab"
path = "src/main.rs"
