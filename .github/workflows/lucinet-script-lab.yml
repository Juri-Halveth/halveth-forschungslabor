name: Check LUCINET Script Lab
on:
  push:
    paths:
      - 'branches/lucinet-script-lab/**'
      - '.github/workflows/lucinet-script-lab.yml'
  pull_request:
    paths:
      - 'branches/lucinet-script-lab/**'
      - '.github/workflows/lucinet-script-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.97.0 fmt --all -- --check
        working-directory: branches/lucinet-script-lab
      - run: cargo +1.97.0 test --locked
        working-directory: branches/lucinet-script-lab
      - run: cargo +1.97.0 clippy --locked --all-targets -- -D warnings
        working-directory: branches/lucinet-script-lab
