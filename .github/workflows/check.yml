name: Check local research modules
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: node branches/security-workbench/cli.mjs runtime --require-patch
      - run: npm test
  temporal-clock:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project branches/temporal-clock/HALVETH.Clock.csproj -- --self-test
      - run: dotnet publish branches/temporal-clock/HALVETH.Clock.csproj -c Release -o branches/temporal-clock/publish
      - run: branches/temporal-clock/publish/HALVETH.Clock.exe --self-test
      - run: dotnet build branches/temporal-clock/vector/HALVETH.Chronosphere.csproj -c Release
      - run: dotnet publish branches/temporal-clock/vector/HALVETH.Chronosphere.csproj -c Release -o branches/temporal-clock/vector/publish
      - shell: pwsh
        run: |
          $test = Start-Process -FilePath branches/temporal-clock/vector/publish/HALVETH.Chronosphere.exe -ArgumentList '--self-test' -WindowStyle Hidden -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw 'Vector clock self-test failed' }
