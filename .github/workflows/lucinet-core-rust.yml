name: Check LUCINET Rust core
on:
  push:
    paths:
      - 'branches/lucinet-core-rust/**'
      - '.github/workflows/lucinet-core-rust.yml'
  pull_request:
    paths:
      - 'branches/lucinet-core-rust/**'
      - '.github/workflows/lucinet-core-rust.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal
      - run: rustup component add --toolchain 1.97.0 rustfmt clippy
      - run: cargo +1.97.0 fmt --check --manifest-path branches/lucinet-core-rust/Cargo.toml
      - run: cargo +1.97.0 test --locked --manifest-path branches/lucinet-core-rust/Cargo.toml
      - run: cargo +1.97.0 clippy --locked --manifest-path branches/lucinet-core-rust/Cargo.toml --all-targets -- -D warnings
