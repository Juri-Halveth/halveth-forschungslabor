name: Publish Encounter research site
on:
  push:
    branches: [main]
    paths:
      [
        "branches/encounter-systems/**",
        "branches/endeck-observer/**",
        "branches/security-workbench/**",
        "branches/security-research-hub/**",
        "research/lifecycle-echo/**",
        "catalog/**",
        "scripts/build-learning-hub*",
        "scripts/build-encounter-site*",
        ".github/workflows/encounter-pages.yml",
        "LICENSE*",
        "RIGHTS-RESERVATION.md",
      ]
  pull_request:
    paths:
      [
        "branches/encounter-systems/**",
        "branches/endeck-observer/**",
        "branches/security-workbench/**",
        "branches/security-research-hub/**",
        "research/lifecycle-echo/**",
        "catalog/**",
        "scripts/build-learning-hub*",
        "scripts/build-encounter-site*",
        ".github/workflows/encounter-pages.yml",
        "LICENSE*",
        "RIGHTS-RESERVATION.md",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: encounter-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Check publication boundary and research results
        run: |
          node branches/security-workbench/cli.mjs runtime --require-patch
          node --test branches/security-workbench/core.test.mjs branches/security-workbench/http-fixture.test.mjs
          node --test branches/security-research-hub/model.test.mjs
          node --test scripts/build-encounter-site.test.mjs
          node --test branches/endeck-observer/model.test.mjs
          node --test branches/endeck-observer/learning.test.mjs
          node scripts/build-learning-hub.mjs --check
          node branches/encounter-systems/research.mjs --check
          node --test branches/encounter-systems/signal-model.test.mjs
          node branches/encounter-systems/signal-research.mjs --check
      - name: Package only the approved public module
        run: node scripts/build-encounter-site.mjs _encounter-site "$GITHUB_SHA"
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload publication artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _encounter-site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
